<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b5e2e">

  <title>Contact Us | IT Zone Electronics</title>
  <meta name="description"
        content="Get in touch with IT Zone Electronics — Karachi, Pakistan. Call +92 300 1234567 or email hello@itzone.pk.">
  <link rel="canonical" href="https://itzone.pk/pages/contact.html">

  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Contact Us | IT Zone Electronics">
  <meta property="og:description" content="Call, email, or visit us in Karachi.">
  <meta property="og:url"         content="https://itzone.pk/pages/contact.html">
  <meta property="og:image"       content="https://itzone.pk/assets/img/og/og-default.jpg">

  <link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/vendors/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body data-page="contact">

  <a href="#main" class="skip-link">Skip to main content</a>

  <header class="site-header"></header>

  <main id="main" tabindex="-1">
    <section class="section">
      <div class="container">
        <h1>Contact</h1>
        <p class="section-subtitle">
          We're available 10 AM – 9 PM, Mon–Sat.
        </p>

        <div class="row g-4 mt-4">
          <div class="col-md-4">
            <div class="card p-4">
              <i data-lucide="phone" style="color: var(--brand-primary); margin-bottom: 0.75rem;"></i>
              <h2 class="h5">Call</h2>
              <a href="tel:+923001234567">+92 300 1234567</a>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-4">
              <i data-lucide="mail" style="color: var(--brand-primary); margin-bottom: 0.75rem;"></i>
              <h2 class="h5">Email</h2>
              <a href="mailto:hello@itzone.pk">hello@itzone.pk</a>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-4">
              <i data-lucide="map-pin" style="color: var(--brand-primary); margin-bottom: 0.75rem;"></i>
              <h2 class="h5">Visit</h2>
              <p class="mb-0">Karachi, Pakistan</p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer"></footer>

  <script defer src="../assets/js/vendors/bootstrap.bundle.min.js"></script>
  <script defer src="../assets/js/vendors/lucide.min.js"></script>
  <script defer src="../assets/js/components/Navbar.js"></script>
  <script defer src="../assets/js/components/Footer.js"></script>
  <script defer src="../assets/js/main.js"></script>
