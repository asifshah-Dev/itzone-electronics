<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 120 120"
     fill="none"
     role="img"
     aria-label="IT Zone Electronics">

  <defs>
    <!-- Green gradient for the arc + letters -->
    <linearGradient id="itzGreen" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0b5e2e"/>
      <stop offset="100%" stop-color="#1a8a4a"/>
    </linearGradient>

    <!-- Red gradient for the power symbol -->
    <linearGradient id="itzRed" x1="60" y1="15" x2="60" y2="65" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#e01e2e"/>
      <stop offset="100%" stop-color="#8f0c17"/>
    </linearGradient>

    <!-- Subtle drop shadow on the power stem -->
    <filter id="itzSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2"/>
      <feOffset dx="0" dy="1" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ── Green crescent arc (open at top, thicker at sides) ── -->
  <path d="M 22 40
           A 48 48 0 1 0 98 40"
        stroke="url(#itzGreen)"
        stroke-width="9"
        stroke-linecap="round"
        fill="none"/>

  <!-- ── Red power symbol ─────────────────────────────────── -->
  <!-- Outer ring, open at top -->
  <path d="M 38 34
           A 22 22 0 1 0 82 34"
        stroke="url(#itzRed)"
        stroke-width="9"
        stroke-linecap="round"
        fill="none"
        filter="url(#itzSoft)"/>

  <!-- Vertical stem (rounded rect) -->
  <rect x="54" y="14" width="12" height="34" rx="6"
        fill="url(#itzRed)"
        filter="url(#itzSoft)"/>

  <!-- ── IT letters (I + T) ──────────────────────────────── -->
  <!-- I : left vertical bar -->
  <rect x="40" y="70" width="14" height="42" rx="4"
        fill="url(#itzGreen)"/>

  <!-- T : stem + crossbar -->
  <rect x="66" y="70" width="14" height="42" rx="4"
        fill="url(#itzGreen)"/>
  <path d="M 66 74 L 90 74 L 90 82 L 66 82 Z"
        fill="url(#itzGreen)"/>
</svg> 
